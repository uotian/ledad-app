name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: npm ci
      - run: uv sync --locked --project backend --python 3.13
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:python
      - run: npm run test:coverage
      - run: npm run test:python:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: artifacts/coverage/
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: npm ci
      - run: uv sync --locked --project backend --python 3.13
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: artifacts/e2e/
          retention-days: 7
