[project]
name = "ledad-service"
version = "0.9.2"
description = "ledad local meeting and AI service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "openai>=2.0,<3",
  "google-genai>=1.0,<3",
  "pydantic>=2.11,<3",
  "pypdf>=6,<7",
  "python-dotenv>=1,<2",
  "aiohttp>=3.12,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.13,<1",
    "pyinstaller>=6,<7",
    "watchfiles>=1,<2",
    "pytest-cov==7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledad"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.coverage.run]
branch = true
source = ["ledad"]
data_file = "artifacts/coverage/.coverage"

[tool.coverage.report]
show_missing = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
