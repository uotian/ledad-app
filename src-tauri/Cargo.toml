[package]
name = "ledad"
version = "0.9.0"
description = "あなたの言葉を、あなたのペースで。"
authors = ["ledad"]
edition = "2021"

[lib]
name = "ledad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
keyring = { version = "3", features = ["apple-native"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow", "NSScreen"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSGeometry"] }
